name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: Test (Elixir ${{ matrix.versions.elixir }} OTP ${{ matrix.versions.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        versions:
          - elixir: "1.15.8"
            otp: "25.3.2.9"
          - elixir: "1.18.4"
            otp: "27.3"
          - elixir: "1.19.5"
            otp: "28.3.3"
            lint: true

    env:
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install (Elixir)
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.versions.elixir }}
          otp-version: ${{ matrix.versions.otp }}

      - name: Cache
        uses: actions/cache@v4
        id: cache
        with:
          key: elixir-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}-${{ github.ref }}
          restore-keys: |
            elixir-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}-refs/heads/${{ github.event.repository.default_branch }}
            elixir-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
            elixir-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
          path: |
            _build
            deps

      - name: Install (Mix)
        if: steps.cache.outputs.cache-hit != 'true'
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix coveralls.github

      - name: Format
        if: ${{ matrix.versions.lint }}
        run: mix format --check-formatted

      - name: Credo
        if: ${{ matrix.versions.lint }}
        run: mix credo

      - name: Dialyzer
        if: ${{ matrix.versions.lint }}
        run: mix dialyzer
